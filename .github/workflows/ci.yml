name: CI

# The pure decision surface needs no dependencies, so it runs on every push.
# `test/live.test.js` exercises the wrappers over the real `@deepseek-ai/dsh-llm`
# runtime; it skips itself when that peer is not installed, which is why it is
# listed here too: a checkout that happens to have the harness installed gets
# those checks for free.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Package manifest loads
        run: node -e "const p=require('./package.json'); if(!p.name) process.exit(1); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch is required for profile bundles')"
      - name: Decision surface
        run: node test/router.test.js
      - name: Harness integration (skips without @deepseek-ai/dsh-llm)
        run: node test/live.test.js
